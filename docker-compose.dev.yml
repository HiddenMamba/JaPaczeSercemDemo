version: "3.8"

# ── Local development: full stack on localhost ────────────────────────────────
# Option A - with Next.js in Docker (full stack):
#   docker compose -f docker-compose.dev.yml up -d
#   Open http://localhost:3000
#
# Option B - Next.js outside Docker (hot reload):
#   docker compose -f docker-compose.dev.yml up -d postgres directus
#   cp frontend/.env.example frontend/.env.local   # edit token if needed
#   cd frontend && npm install && npm run dev
#   Open http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: catadoption
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus_dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus"]
      interval: 5s
      timeout: 3s
      retries: 10

  directus:
    image: directus/directus:11
    restart: unless-stopped
    ports:
      - "8055:8055"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET: dev-secret-change-in-production
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: catadoption
      DB_USER: directus
      DB_PASSWORD: directus_dev_password
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123
      PUBLIC_URL: http://localhost:8055
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:3000"
    volumes:
      - directus_dev_uploads:/directus/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_SITE_NAME: "Ja Pacze Sercem"
        NEXT_PUBLIC_DIRECTUS_URL: http://localhost:8055
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - directus
    environment:
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      DIRECTUS_HOST: localhost
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hello@example.org}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: "Ja Pacze Sercem"
      NEXT_PUBLIC_DIRECTUS_URL: http://localhost:8055

volumes:
  postgres_dev_data:
  directus_dev_uploads:
